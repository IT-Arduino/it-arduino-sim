<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- IT-Arduino Симулятор. Палитра из tailwind.config.js основного сайта:
       фон #1A1A40 (primary), корпус и выводы #00B8D4 (primary.light). -->
  <!-- Фон -->
  <rect width="32" height="32" rx="6" fill="#1a1a40"/>
  <!-- Корпус микросхемы -->
  <rect x="8" y="8" width="16" height="16" rx="2" fill="#00b8d4"/>
  <!-- Кристалл, темнее корпуса -->
  <rect x="11" y="11" width="10" height="10" rx="1" fill="#0090a8"/>
  <!-- Выводы сверху -->
  <rect x="12" y="3" width="3" height="5" rx="1" fill="#00b8d4"/>
  <rect x="17" y="3" width="3" height="5" rx="1" fill="#00b8d4"/>
  <!-- Выводы снизу -->
  <rect x="12" y="24" width="3" height="5" rx="1" fill="#00b8d4"/>
  <rect x="17" y="24" width="3" height="5" rx="1" fill="#00b8d4"/>
  <!-- Выводы слева -->
  <rect x="3" y="12" width="5" height="3" rx="1" fill="#00b8d4"/>
  <rect x="3" y="17" width="5" height="3" rx="1" fill="#00b8d4"/>
  <!-- Выводы справа -->
  <rect x="24" y="12" width="5" height="3" rx="1" fill="#00b8d4"/>
  <rect x="24" y="17" width="5" height="3" rx="1" fill="#00b8d4"/>
</svg>
