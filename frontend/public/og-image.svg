<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Карточка для соцсетей. Рендерится в og-image.png скриптом
       scripts/generate-og-image.mjs.

       Палитра — из tailwind.config.js основного сайта: #1A1A40 (primary),
       #00B8D4 (primary.light), #00C853 (secondary), #121212 (dark).

       Шрифты перечислены стеком, а не одним именем: resvg подставит первый,
       который найдёт в системе. Кириллица есть во всех перечисленных. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1a1a40"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b8d4"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Тонкая сетка, намёк на макетную плату -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- Значок микросхемы, тот же мотив что в favicon -->
  <g transform="translate(552, 150) scale(3)">
    <rect x="8" y="8" width="16" height="16" rx="2" fill="#00b8d4"/>
    <rect x="11" y="11" width="10" height="10" rx="1" fill="#0090a8"/>
    <rect x="12" y="3" width="3" height="5" rx="1" fill="#00b8d4"/>
    <rect x="17" y="3" width="3" height="5" rx="1" fill="#00b8d4"/>
    <rect x="12" y="24" width="3" height="5" rx="1" fill="#00b8d4"/>
    <rect x="17" y="24" width="3" height="5" rx="1" fill="#00b8d4"/>
    <rect x="3" y="12" width="5" height="3" rx="1" fill="#00b8d4"/>
    <rect x="3" y="17" width="5" height="3" rx="1" fill="#00b8d4"/>
    <rect x="24" y="12" width="5" height="3" rx="1" fill="#00b8d4"/>
    <rect x="24" y="17" width="5" height="3" rx="1" fill="#00b8d4"/>
  </g>

  <!-- Название -->
  <text x="600" y="380" text-anchor="middle"
        font-family="Rubik, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1"
        fill="url(#title-grad)">IT-Arduino Симулятор</text>

  <!-- Подзаголовок -->
  <text x="600" y="436" text-anchor="middle"
        font-family="Rubik, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif"
        font-size="26" font-weight="400" fill="#9aa0b4">
    Схемы и скетчи Arduino прямо в браузере
  </text>

  <!-- Платы -->
  <g text-anchor="middle"
     font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace"
     font-size="18" fill="#00b8d4">
    <text x="380" y="512">Arduino Uno</text>
    <text x="560" y="512">Nano</text>
    <text x="700" y="512">Mega 2560</text>
    <text x="860" y="512">ATtiny85</text>
  </g>

  <!-- Домен -->
  <text x="600" y="576" text-anchor="middle"
        font-family="Rubik, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif"
        font-size="20" font-weight="500" fill="#00c853">it-arduino.ru</text>
</svg>
