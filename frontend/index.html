    <!-- ═══════════════════════════════════════════════
         ШРИФТЫ — только со своего сервера

         Здесь НЕТ и не должно появиться ни preconnect к fonts.googleapis.com,
         ни dns-prefetch к github.com или discord.com. Симулятор обязан
         работать целиком со своего сервера: любое соединение наружу — это и
         утечка факта захода, и точка отказа там, где внешние сервисы могут
         быть недоступны. Content-Security-Policy в docker/nginx.avr.conf
         блокирует такие запросы, так что нарушение сразу видно в консоли.

         Rubik разбит по субсетам, поэтому в preload идут оба: кириллица для
         интерфейса, латиница для названий плат, FQBN и кода.
    ═══════════════════════════════════════════════ -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/rubik-cyrillic-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/rubik-latin-wght-normal.woff2" crossorigin />
