# nginx site for the AVR-only IT-Arduino Simulator image.
#
# Forked from docker/nginx.conf. Two differences:
#
#   1. The /api/simulation/ws/ WebSocket block is gone — the QEMU bridge it
#      proxied does not exist in this fork.
#   2. Framing and a Content-Security-Policy replace the blanket
#      X-Frame-Options, so the simulator can be embedded by the main site
#      while every other origin stays blocked. See the CSP note below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use relative redirects (e.g. `/examples/` instead of
    # `http://sim.it-arduino.ru/examples/`) so trailing-slash and other
    # internal redirects don't downgrade HTTPS clients to HTTP. We sit behind
    # a TLS terminator (the host nginx); without this nginx generates
    # absolute Location headers using the listening protocol (http) and the
    # browser blocks the redirect as mixed-content.
    absolute_redirect off;

    # Security headers.
    #
    # X-Frame-Options is deliberately NOT set: it has no syntax for "one
    # specific other origin", and SAMEORIGIN would break embedding the
    # simulator in a page on it-arduino.ru. frame-ancestors below does the
    # same job with the precision we need, and every browser that can run
    # this app supports it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — this is what MAKES the "no external requests"
    # guarantee enforceable instead of merely intended. Anything the page
    # tries to fetch from a host not listed here is blocked by the browser
    # and shows up in the console, so a regression cannot pass unnoticed.
    #
    # What the policy is FOR, precisely: no third-party host. That job is done
    # by default-src, connect-src, img-src and font-src — by the host lists,
    # not by the inline-script rules. Keep the host lists tight; the two
    # relaxations below cost nothing against that goal.
    #
    #   script-src 'wasm-unsafe-eval'  ngspice-WASM and the custom-chip WASM
    #                                  runtime compile WebAssembly.
    #   script-src / worker-src blob:  Monaco spawns its language workers from
    #                                  blob: URLs.
    #   script-src 'unsafe-inline'     Monaco's AMD loader and the emscripten
    #                                  glue inject <script> elements at
    #                                  runtime. Their hashes change with every
    #                                  dependency bump, so pinning them would
    #                                  break the editor on the next npm update
    #                                  — and silently, since a blocked script
    #                                  only shows up in the console. An inline
    #                                  script cannot reach another host, so the
    #                                  guarantee above is unaffected.
    #   style-src 'unsafe-inline'      Monaco and the canvas write inline
    #                                  styles at runtime.
    #   font-src 'self' data:          fonts come from this origin — never
    #                                  fonts.googleapis.com. `data:` is for
    #                                  Monaco's icon font, which ships base64
    #                                  inside its own CSS; without it every
    #                                  toolbar icon in the editor renders as a
    #                                  box. A data: URI is part of the page,
    #                                  not a request to anywhere.
    #   connect-src api.it-arduino.ru  the main site's API — circuit storage.
    #                                  Drop it if you self-host standalone.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.it-arduino.ru; frame-ancestors 'self' https://it-arduino.ru https://www.it-arduino.ru; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    # Proxy /api/* requests to the FastAPI backend.
    # FastAPI Swagger UI is at /api/docs (moved from /docs to avoid
    # conflicting with the frontend /docs/* documentation routes).
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
    }

    # Cache static assets with content-hash filenames (js/css/fonts/images)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml;

    # Frontend SPA routing — must be last so specific locations above take precedence
    location / {
        try_files $uri $uri/ /index.html;
    }
}
